# Custom ModSecurity configuration for Stage 5 Baseline Evaluation
# Ensures JSON-formatted audit logging and identical body inspection cap

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecRequestBodyLimit 16384
SecRequestBodyNoFilesLimit 16384
SecResponseBodyAccess Off

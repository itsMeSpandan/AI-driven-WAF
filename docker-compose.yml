services:
  # Protected Vulnerable Target: OWASP Juice Shop
  # Internal only - not published to host by default, accessible only through the WAF Gateway
  demo-app:
    image: bkimminich/juice-shop:v17.1.1
    container_name: waf-demo-app
    restart: unless-stopped
    networks:
      - waf-network
    # Internal network only; accessible exclusively through the WAF Gateway
    expose:
      - "3000"

  # WAF Gateway: Reverse Proxy & L7 Inspection Engine
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: waf-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - UPSTREAM_URL=${UPSTREAM_URL:-http://demo-app:3000}
      - WAF_MODE=${WAF_MODE:-block}
      - ML_THRESHOLD=${ML_THRESHOLD:-0.75}
      - DB_URL=sqlite:////data/waf.db
      - MAX_BODY_INSPECT_BYTES=${MAX_BODY_INSPECT_BYTES:-16384}
      - FAIL_MODE=${FAIL_MODE:-closed}
    volumes:
      - waf-storage:/data
    depends_on:
      demo-app:
        condition: service_started
    networks:
      - waf-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Dashboard API: Analytics REST API & SSE Live Event Stream
  dashboard-api:
    build:
      context: .
      dockerfile: dashboard/api/Dockerfile
    container_name: waf-dashboard-api
    restart: unless-stopped
    ports:
      - "${DASHBOARD_API_PORT:-8000}:8000"
    environment:
      - DB_URL=sqlite:////data/waf.db
      - WAF_MODE=${WAF_MODE:-block}
      - ML_THRESHOLD=${ML_THRESHOLD:-0.75}
    volumes:
      - waf-storage:/data
    networks:
      - waf-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Dashboard UI: Next.js Real-Time SecOps Interface
  dashboard-ui:
    build:
      context: ./dashboard/ui
      dockerfile: Dockerfile
    container_name: waf-dashboard-ui
    restart: unless-stopped
    ports:
      - "${DASHBOARD_UI_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      dashboard-api:
        condition: service_started
    networks:
      - waf-network

  # ============================================================================
  # ModSecurity + OWASP CRS Baseline Services (Stage 5 Benchmarking)
  # Activated with `--profile baseline`: docker compose --profile baseline up -d
  # ============================================================================
  modsecurity-pl1:
    image: owasp/modsecurity-crs:4.8.0-apache-202410200812
    container_name: waf-modsec-pl1
    profiles:
      - baseline
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      - BACKEND=http://demo-app:3000
      - PARANOIA=1
      - BLOCKING_PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - MODSEC_RULE_ENGINE=On
      - MODSEC_REQ_BODY_LIMIT=16384
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_LOG=/var/log/apache2/modsec_audit.log
    volumes:
      - ./eval/modsec/modsec-pl1-audit.log:/var/log/apache2/modsec_audit.log
      - ./eval/modsec/custom-audit.conf:/etc/modsecurity.d/owasp-crs/custom-audit.conf:ro
    depends_on:
      demo-app:
        condition: service_started
    networks:
      - waf-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  modsecurity-pl2:
    image: owasp/modsecurity-crs:4.8.0-apache-202410200812
    container_name: waf-modsec-pl2
    profiles:
      - baseline
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    environment:
      - BACKEND=http://demo-app:3000
      - PARANOIA=2
      - BLOCKING_PARANOIA=2
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - MODSEC_RULE_ENGINE=On
      - MODSEC_REQ_BODY_LIMIT=16384
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_LOG=/var/log/apache2/modsec_audit.log
    volumes:
      - ./eval/modsec/modsec-pl2-audit.log:/var/log/apache2/modsec_audit.log
      - ./eval/modsec/custom-audit.conf:/etc/modsecurity.d/owasp-crs/custom-audit.conf:ro
    depends_on:
      demo-app:
        condition: service_started
    networks:
      - waf-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

